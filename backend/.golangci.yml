version: "2"

linters:
  default: standard
  enable:
    - wsl_v5
    - wrapcheck
    - errorlint
    - gosmopolitan
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosmopolitan:
      watch-for-scripts:
        - Cyrillic
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosmopolitan

formatters:
  enable:
    - gofmt
